<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>奧特曼全能挑戰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: Arial, "PMingLiU", "新細明體", "Microsoft JhengHei", sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 2rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            width: 95vw;
            max-width: 850px;
            max-height: 95vh;
            padding: 1.5rem;
            text-align: center;
            position: relative;
            border: 6px solid #ef4444;
            overflow-y: auto;
        }

        /* iPad Mini 橫式優化 */
        @media (orientation: landscape) and (max-height: 700px) {
            .game-container-layout { display: flex; flex-direction: row; align-items: center; gap: 20px; }
            .side-info { width: 120px; flex-shrink: 0; }
            .main-game-area { flex: 1; }
            #question-area { font-size: 2.25rem !important; }
        }

        .ultraman-avatar {
            width: 80px; height: 80px;
            margin: -50px auto 10px;
            background: #fff;
            border-radius: 50%;
            border: 5px solid #ef4444;
            display: flex; align-items: center; justify-content: center;
            font-size: 40px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .number-btn, .letter-btn {
            background: #f3f4f6; border: 2px solid #e5e7eb; touch-action: manipulation;
        }
        .number-btn:active, .letter-btn:active { background: #d1d5db; transform: scale(0.95); }

        .star-particle { position: absolute; pointer-events: none; animation: fly 1s ease-out forwards; }
        @keyframes fly { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; } }
        
        #wrong-questions-list {
            max-height: 150px;
            overflow-y: auto;
            border: 1px dashed #ef4444;
            background: #fff5f5;
        }
    </style>
</head>
<body>

<div class="game-card" id="game-container">
    <div class="ultraman-avatar" id="avatar">🦸</div>
    
    <!-- 主選單 -->
    <div id="category-screen" class="w-full">
        <h1 class="text-3xl font-bold text-red-600 mb-2">奧特曼全能挑戰</h1>
        <p class="text-blue-600 mb-6 font-bold">答對 25 題獲得獎盃 🏆</p>
        <div class="grid grid-cols-1 gap-4 max-w-sm mx-auto">
            <button onclick="showSubMenu('math')" class="bg-blue-600 text-white text-xl py-5 rounded-2xl shadow-lg font-bold">數學挑戰 ➕</button>
            <button onclick="showSubMenu('english')" class="bg-purple-600 text-white text-xl py-5 rounded-2xl shadow-lg font-bold">英文挑戰 🔤</button>
        </div>
    </div>

    <!-- 數學子選單 -->
    <div id="math-menu" class="hidden w-full">
        <h2 class="text-2xl font-bold text-blue-700 mb-6">數學練習項目</h2>
        <div class="grid grid-cols-1 gap-4 max-w-sm mx-auto">
            <button onclick="startGame('subtraction-challenge')" class="bg-red-500 text-white text-lg py-4 rounded-xl font-bold shadow-md">1-20 減法 (25題挑戰)</button>
            <button onclick="startGame('sequence')" class="bg-white border-2 border-blue-600 text-blue-600 text-lg py-4 rounded-xl font-bold">1-30 數列挑戰</button>
            <button onclick="startGame('arithmetic')" class="bg-white border-2 border-blue-600 text-blue-600 text-lg py-4 rounded-xl font-bold">1-10 混合加減</button>
            <button onclick="location.reload()" class="mt-4 text-gray-500 underline">返回</button>
        </div>
    </div>

    <!-- 英文子選單 -->
    <div id="english-menu" class="hidden w-full">
        <h2 class="text-2xl font-bold text-purple-700 mb-6">英文練習項目</h2>
        <div class="grid grid-cols-1 gap-4 max-w-sm mx-auto">
            <button onclick="startGame('upper-to-lower')" class="bg-white border-2 border-purple-600 text-purple-600 text-lg py-4 rounded-xl font-bold">大寫選小寫 (A → a)</button>
            <button onclick="startGame('lower-to-upper')" class="bg-white border-2 border-purple-600 text-purple-600 text-lg py-4 rounded-xl font-bold">小寫選大寫 (a → A)</button>
            <button onclick="location.reload()" class="mt-4 text-gray-400 underline">返回</button>
        </div>
    </div>

    <!-- 遊戲區域 -->
    <div id="game-screen" class="hidden w-full">
        <div class="game-container-layout">
            <div class="side-info">
                <div class="flex justify-between items-center mb-4 landscape:block">
                    <div class="text-center font-bold text-gray-500 text-sm mb-1" id="q-progress">進度: 0 / 25 題</div>
                    <button onclick="exitGame()" class="mt-2 text-gray-400 font-bold text-xs">❌ 退出</button>
                </div>
            </div>

            <div class="main-game-area">
                <div id="question-area" class="text-4xl md:text-5xl font-bold text-blue-900 mb-4 h-20 flex items-center justify-center tracking-widest overflow-hidden"></div>

                <div id="answer-box-container" class="flex justify-center items-center gap-2 mb-4">
                    <div id="std-input-wrap">
                        <input type="text" id="answer-input" readonly class="w-48 text-center text-4xl border-b-4 border-blue-500 bg-blue-50 text-red-600 font-bold rounded-t-lg" placeholder="?">
                    </div>
                </div>

                <div id="num-keyboard" class="grid grid-cols-5 gap-2 w-full max-w-sm mx-auto mb-4 hidden">
                    <script>
                        for(let i=1; i<=9; i++) document.write(`<button onclick="pressKey('${i}')" class="number-btn py-3 rounded-xl text-2xl font-bold">${i}</button>`);
                        document.write(`<button onclick="pressKey('0')" class="number-btn py-3 rounded-xl text-2xl font-bold">0</button>`);
                    </script>
                </div>

                <div id="letter-keyboard" class="hidden w-full max-w-md mx-auto mb-4">
                    <div class="grid grid-cols-7 gap-1" id="alphabet-btns"></div>
                </div>

                <div class="grid grid-cols-3 gap-2 w-full max-w-sm mx-auto">
                    <button onclick="clearInput()" class="bg-gray-400 text-white py-3 rounded-xl font-bold">清除</button>
                    <button onclick="nextQuestion(true)" class="bg-yellow-500 text-white py-3 rounded-xl font-bold">跳過</button>
                    <button id="submit-btn" onclick="checkAnswer()" class="bg-green-500 text-white py-3 rounded-xl font-bold shadow-md">確定 💥</button>
                </div>
                <div id="feedback" class="mt-4 h-6 font-bold text-lg"></div>
            </div>
        </div>
    </div>

    <!-- 結果畫面 -->
    <div id="result-screen" class="hidden w-full">
        <h2 class="text-3xl font-bold text-red-600 mb-2" id="result-title">挑戰完成！</h2>
        <div class="text-5xl mb-2" id="result-icon">🏆</div>
        <p class="text-2xl mb-1 font-bold text-blue-800" id="result-score">100 分達成！</p>
        
        <div class="bg-blue-50 border-2 border-blue-200 rounded-2xl p-3 mb-4 max-w-sm mx-auto text-left">
            <p class="text-lg font-bold text-purple-600 mb-1" id="result-stats">總共練習 25 題，答對 25 題</p>
            <p class="text-md font-bold text-gray-700 mb-2" id="result-time-detail">消耗時間：0 分 0 秒</p>
            
            <div id="wrong-area" class="mt-2 hidden">
                <p class="text-red-500 font-bold text-sm mb-1">⚠️ 需要練習的題目：</p>
                <div id="wrong-questions-list" class="rounded-lg p-2 text-sm font-bold text-gray-600 grid grid-cols-2 gap-2">
                </div>
            </div>
        </div>

        <button onclick="location.reload()" class="w-full max-w-xs mx-auto bg-blue-600 text-white py-4 rounded-xl text-xl font-bold shadow-lg">回主選單</button>
    </div>
</div>

<script>
    let mode = '';
    let target = '';
    let currentQuestionDisplay = ''; 
    let inputArr = [];
    let score = 0;
    let questionsSolved = 0; 
    let correctCount = 0;
    let timerInterval = null;
    let startTime = null;
    let wrongQuestions = []; 

    // 每回合變更為 25 題，每題 4 分
    const pointsPerQuestion = 4;
    const challengeMaxQuestions = 25;

    const alphabet = "abcdefghijklmnopqrstuvwxyz".split('');
    let usedLetters = [];

    function showSubMenu(cat) {
        document.getElementById('category-screen').classList.add('hidden');
        document.getElementById(cat + '-menu').classList.remove('hidden');
    }

    function updateLetterKeyboard(isUpper) {
        const container = document.getElementById('alphabet-btns');
        container.innerHTML = '';
        alphabet.forEach(l => {
            const displayChar = isUpper ? l.toUpperCase() : l.toLowerCase();
            const btn = document.createElement('button');
            btn.className = 'letter-btn py-2 rounded-lg text-lg font-bold';
            btn.innerText = displayChar;
            btn.onclick = () => pressKey(displayChar);
            container.appendChild(btn);
        });
    }

    function startGame(m) {
        mode = m;
        score = 0;
        questionsSolved = 0;
        correctCount = 0;
        usedLetters = [];
        wrongQuestions = [];
        startTime = new Date();
        clearInterval(timerInterval);

        document.getElementById('math-menu').classList.add('hidden');
        document.getElementById('english-menu').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        
        const isEnglish = (m === 'upper-to-lower' || m === 'lower-to-upper');
        document.getElementById('num-keyboard').classList.toggle('hidden', isEnglish);
        document.getElementById('letter-keyboard').classList.toggle('hidden', !isEnglish);
        
        if (isEnglish) updateLetterKeyboard(m === 'lower-to-upper');
        nextQuestion();
    }

    function exitGame() {
        clearInterval(timerInterval);
        location.reload();
    }

    function nextQuestion(isSkip = false) {
        if(isSkip) {
            questionsSolved++;
            if(questionsSolved >= challengeMaxQuestions) {
                endGame();
                return;
            }
        }

        if (questionsSolved >= challengeMaxQuestions) {
            endGame();
            return;
        }

        document.getElementById('q-progress').innerText = `進度: ${questionsSolved + 1} / ${challengeMaxQuestions} 題`;

        inputArr = [];
        updateUI();
        document.getElementById('feedback').innerText = '';
        document.getElementById('avatar').innerText = "🤔";

        const qText = document.getElementById('question-area');

        if(mode === 'sequence') {
            const len = Math.floor(Math.random() * 4) + 3; 
            const start = Math.floor(Math.random() * (30 - len)) + 1;
            const seq = Array.from({length: len}, (_, i) => start + i);
            const gapIdx = Math.floor(Math.random() * len);
            target = seq[gapIdx].toString();
            currentQuestionDisplay = seq.map((n, i) => i === gapIdx ? "__" : n).join(", ");
            qText.innerText = currentQuestionDisplay;
            qText.style.fontSize = len > 5 ? "1.5rem" : "2.25rem";
        } 
        else if(mode === 'arithmetic') {
            let a = Math.floor(Math.random()*5)+5, b = Math.floor(Math.random()*5)+1;
            if(Math.random() > 0.5) { 
                target = (a+b).toString(); 
                currentQuestionDisplay = `${a} + ${b} = ?`;
            } else { 
                target = (a-b).toString(); 
                currentQuestionDisplay = `${a} - ${b} = ?`;
            }
            qText.innerText = currentQuestionDisplay;
            qText.style.fontSize = "3rem";
        }
        else if(mode === 'subtraction-challenge') {
            let a, b, res;
            do { a = Math.floor(Math.random() * 9) + 11; b = Math.floor(Math.random() * 9) + 1; res = a - b; } while (res >= 10); 
            target = res.toString();
            currentQuestionDisplay = `${a} - ${b} = ?`;
            qText.innerText = currentQuestionDisplay;
            qText.style.fontSize = "4rem";
        }
        else if(mode === 'upper-to-lower' || mode === 'lower-to-upper') {
            if (usedLetters.length >= 26) usedLetters = [];
            let available = alphabet.filter(l => !usedLetters.includes(l));
            let char = available[Math.floor(Math.random() * available.length)];
            usedLetters.push(char);
            if (mode === 'upper-to-lower') {
                target = char.toLowerCase();
                currentQuestionDisplay = `${char.toUpperCase()} 的小寫`;
                qText.innerHTML = `<span class="text-7xl text-purple-700">${char.toUpperCase()}</span> <span class="text-xl ml-4">選小寫</span>`;
            } else {
                target = char.toUpperCase();
                currentQuestionDisplay = `${char.toLowerCase()} 的大寫`;
                qText.innerHTML = `<span class="text-7xl text-purple-700">${char.toLowerCase()}</span> <span class="text-xl ml-4">選大寫</span>`;
            }
        }
    }

    function pressKey(k) {
        if(inputArr.length < 5) { inputArr.push(k); updateUI(); }
    }

    function clearInput() { inputArr = []; updateUI(); }

    function updateUI() {
        document.getElementById('answer-input').value = inputArr.join('');
    }

    function checkAnswer() {
        if(inputArr.length === 0) return;
        let userAns = inputArr.join('');
        let isCorrect = (userAns === target);
        
        if(isCorrect) {
            score += pointsPerQuestion;
            correctCount++;
            document.getElementById('avatar').innerText = "🤩";
            document.getElementById('feedback').innerText = "正確！💥";
            document.getElementById('feedback').className = "mt-4 h-6 font-bold text-lg text-green-600";
            createStars();
        } else {
            wrongQuestions.push(currentQuestionDisplay);
            document.getElementById('avatar').innerText = "😣";
            document.getElementById('feedback').innerText = "不對喔，加油！";
            document.getElementById('feedback').className = "mt-4 h-6 font-bold text-lg text-red-500";
        }

        questionsSolved++;
        setTimeout(() => {
            if (questionsSolved >= challengeMaxQuestions) endGame();
            else nextQuestion();
        }, 800);
    }

    function createStars() {
        for (let i = 0; i < 15; i++) {
            const star = document.createElement('div');
            star.innerText = "⭐";
            star.className = "star-particle";
            star.style.setProperty('--dx', (Math.random()-0.5)*400+'px');
            star.style.setProperty('--dy', (Math.random()-0.5)*400+'px');
            star.style.left = "50%"; star.style.top = "50%";
            document.getElementById('game-container').appendChild(star);
            setTimeout(() => star.remove(), 1000);
        }
    }

    function endGame() {
        clearInterval(timerInterval);
        const now = new Date();
        const diff = Math.floor((now - startTime) / 1000);
        const mins = Math.floor(diff / 60);
        const secs = diff % 60;

        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        
        document.getElementById('result-score').innerText = `${score} 分達成！`;
        document.getElementById('result-stats').innerText = `總共練習 ${questionsSolved} 題，答對了 ${correctCount} 題`;
        document.getElementById('result-time-detail').innerText = `消耗時間：${mins} 分 ${secs} 秒`;
        
        const wrongArea = document.getElementById('wrong-area');
        const wrongList = document.getElementById('wrong-questions-list');
        wrongList.innerHTML = '';
        
        if (wrongQuestions.length > 0) {
            wrongArea.classList.remove('hidden');
            wrongQuestions.forEach(q => {
                const item = document.createElement('div');
                item.className = "bg-white p-2 rounded shadow-sm border-l-4 border-red-400";
                item.innerText = q;
                wrongList.appendChild(item);
            });
        } else {
            wrongArea.classList.add('hidden');
        }
        
        document.getElementById('avatar').innerText = correctCount >= 22 ? "👑" : "🦸";
    }
</script>

</body>
</html>
